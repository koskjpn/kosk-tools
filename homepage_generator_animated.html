/* ===== 画像アップロード共通関数 ===== */
function uploadImg(callback) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = function() {
    var file = inp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) { callback(e.target.result); };
    reader.readAsDataURL(file);
  };
  inp.click();
}

/* 画像入力UI（URL入力 + アップロードボタン）を返す */
function imgInputUI(currentSrc, onchangeJS, placeholderText) {
  var ph = placeholderText || 'https://...';
  return '<div style="display:flex;gap:5px;align-items:flex-start;margin-bottom:3px">'
    + '<input type="text" value="' + esc(currentSrc) + '" placeholder="' + ph + '" oninput="' + onchangeJS + '" style="flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:12px;color:#000">'
    + '<button onclick="' + onchangeJS.replace('this.value', '__UPL__') + '" data-cb="' + esc(onchangeJS) + '" class="upbtn" style="padding:5px 8px;border:1px solid #2563eb;border-radius:5px;background:#eff6ff;color:#2563eb;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="">📁 アップ</button>'
    + '</div>'
    + (currentSrc ? '<img src="' + esc(currentSrc) + '" style="width:100%;max-height:120px;object-fit:cover;border-radius:5px;border:1px solid #eee;margin-bottom:3px" onerror="this.style.display=\'none\'">' : '');
}

/* アップロードボタン専用（クリック時にFileReaderでbase64取得してコールバック） */
function makeUploadBtn(assignCode) {
  return 'uploadImg(function(b64){' + assignCode + ';renderEdit();})';
}

function uploadVideo(callback) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'video/*';
  inp.onchange = function() {
    var file = inp.files[0];
    if (!file) return;
    if (file.size > 50*1024*1024) {alert('動画ファイルが大きすぎます。50MB以下を推奨します。\n現在: '+Math.round(file.size/1024/1024)+'MB');
    }
    var reader = new FileReader();
    reader.onload = function(e) { callback(e.target.result); };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function pick(el){document.querySelectorAll('.gbtn').forEach(function(b){b.classList.remove('on');});el.classList.add('on');genre=el.dataset.g;document.getElementById('err').style.display='none';}
function toggleChk(el){el.closest('.pchk').classList.toggle('on',el.checked);}
function getSite(id){return sites.find(function(s){return s.id===id;});}
function getSP(sid,pid){var s=getSite(sid);return s?s.subPages.find(function(p){return p.id===pid;}):null;}

function goTab(t){document.querySelectorAll('.mtab').forEach(function(el){el.classList.toggle('on',el.dataset.t===t);});document.querySelectorAll('.pane').forEach(function(el){el.classList.toggle('on',el.id==='pane-'+t);});document.querySelectorAll('.snav').forEach(function(el){el.classList.toggle('on',el.id==='snav-'+t);});
}

function gen(){
  var name=document.getElementById('sname').value.trim();
  var errEl=document.getElementById('err');
  if(!genre||!name){errEl.style.display='block';return;}errEl.style.display='none';
  var selPages=[];document.querySelectorAll('#pageChecks input:checked').forEach(function(c){selPages.push(c.value);});
  var t=T[genre];
  var id='s'+Date.now();
  var subPages=selPages.map(function(pk){
    var sp={id:'p'+Date.now()+'x'+Math.random().toString(36).slice(2,6),pk:pk,title:{menu:'メニュー',staff:'スタッフ',gallery:'ギャラリー',access:'アクセス',news:'お知らせ',recruit:'採用情報'}[pk]||pk,blocks:[]};
    if(pk==='menu') sp.blocks=[{type:'menu',data:{items:t.menu.map(function(m){return[m[0],m[1]];})}}];else if(pk==='staff') sp.blocks=[{type:'staff',data:{members:JSON.parse(JSON.stringify(t.staff))}}];else if(pk==='gallery') sp.blocks=[{type:'gallery',data:{imgs:t.imgs.slice()}}];else if(pk==='access') sp.blocks=[{type:'access',data:{mapEmbed:'',mapUrl:''}}];else if(pk==='news') sp.blocks=[{type:'news',data:{items:JSON.parse(JSON.stringify(t.news))}}];else if(pk==='recruit') sp.blocks=[{type:'recruit',data:JSON.parse(JSON.stringify(t.recruit))}];
    return sp;
  });
  var site={id:id,name:name,genre:genre,sub:t.sub,tl:t.tl,col:t.col,ac:t.ac,hero:t.hero,heroSize:'cover',heroPos:'center center',heroHeight:'100vh',heroTexts:[],imgs:t.imgs.slice(),bodyBg:'#0a0a0a',secBg:'#0e0e0e',textCol:'#e8e8e8',logoCol:'#ffffff',subPages:subPages,mainBlocks:[{type:'gallery',data:{imgs:t.imgs.slice()}}]};sites.push(site);curSiteId=id;curEditPage='main';curPvPage='main';document.getElementById('sname').value='';genre=null;document.querySelectorAll('.gbtn').forEach(function(b){b.classList.remove('on');});
  renderAll();goTab('edit');
}

function selectSite(id){curSiteId=id;curEditPage='main';curPvPage='main';renderAll();goTab('edit');}
function selectSP(sid,pid){curSiteId=sid;curEditPage=pid;curPvPage=pid;renderAll();goTab('edit');}
function delSite(id){
  if(!confirm('このサイトを削除しますか?'))return;sites=sites.filter(function(s){return s.id!==id;});
  if(curSiteId===id)curSiteId=sites.length?sites[0].id:null;
  renderAll();
}
function renderAll(){renderSB();renderCards();if(curSiteId){renderEdit();renderPV();}}

function renderSB(){
  var el=document.getElementById('sbList');
  if(!sites.length){el.innerHTML='<div style="font-size:10px;color:rgba(255,255,255,.2);padding:6px;text-align:center">サイトなし</div>';return;}el.innerHTML=sites.map(function(s){
    var isActive=s.id===curSiteId;
    var pages=s.subPages.map(function(sp){
      var isPageActive=isActive&&curEditPage===sp.id;
      return '<div class="pli'+(isPageActive?' on':'')+'" onclick="selectSP(\''+s.id+'\',\''+sp.id+'\')">'+(PI[sp.pk]||'📄')+' '+esc(sp.title)+'</div>';
    }).join('');
    var mainActive=isActive&&curEditPage==='main';
    return '<div style="margin-bottom:8px">'
      +'<div class="site-item'+(isActive?' on':'')+'" onclick="selectSite(\''+s.id+'\')">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<span style="font-size:12px;font-weight:600;color:rgba(255,255,255,.85)">'+GI[s.genre]+' '+esc(s.name)+'</span>'
      +'<div style="display:flex;gap:4px">'
      +'<button onclick="event.stopPropagation();duplicateSite(\''+s.id+'\')" title="複製" style="border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);cursor:pointer;font-size:10px;padding:2px 5px;border-radius:4px">複製</button>'
      +'<button onclick="event.stopPropagation();delSite(\''+s.id+'\')" title="削除" style="border:none;background:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:13px;padding:0 4px">×</button>'
      +'</div>'
      +'</div><div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:1px">メイン + '+s.subPages.length+'ページ</div>'
      +'</div>'
      +'<div style="padding-left:10px;margin-top:3px">'
      +'<div class="pli'+(mainActive?' on':'')+'" onclick="selectSP(\''+s.id+'\',\'main\')">🏠 メインページ</div>'
      +pages+'</div></div>';
  }).join('');
}

function renderCards(){
  var el=document.getElementById('cardArea');
  if(!sites.length){
    el.innerHTML='<div class="empty"><div style="font-size:36px;margin-bottom:10px">🏗</div><p>まだサイトがありません<br>新規作成から始めましょう</p></div>';

  var html='<div class="cards">';

      tags+='<span class="tag">'+(PI[sp.pk]||'📄')+' '+esc(sp.title)+'</span>';
    });
    html+='<div class="card'+(s.id===curSiteId?' sel':'')+'" onclick="selectSite(\''+s.id+'\')">';

    html+='<div class="card-body">';
    html+='<div class="card-name">'+GI[s.genre]+' '+esc(s.name)+'</div>';
    html+='<div class="card-sub">'+T[s.genre].sub+'</div>';
    html+='<div class="card-tags">'+tags+'</div>';
    html+='<div class="card-btns">';
    html+='<div class="cb" onclick="event.stopPropagation();selectSite(\''+s.id+'\');goTab(\'edit\')">✏️ 編集</div>';

  });

}

/* ===== HTML生成 ===== */
function getYtId(url){
  if(!url) return '';
  var m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m?m[1]:'';
}

function getVimeoId(url){
  if(!url) return '';
  var m=url.match(/vimeo\.com\/(\d+)/);
  return m?m[1]:'';
}

function slugify(t){return(t||'p').replace(/\s+/g,'-').replace(/[^\w぀-鿿-]/g,'').toLowerCase()||'page';}

function toEmbedUrl(url){
  if(!url) return '';
  var ytId=getYtId(url);
  if(ytId) return 'https://www.youtube-nocookie.com/embed/'+ytId+'?rel=0&modestbranding=1';
  var viId=getVimeoId(url);
  if(viId) return 'https://player.vimeo.com/video/'+viId;
  if(url.indexOf('embed')>=0) return url;
  return '';
}
function getFn(sp){return sp._fn||(slugify(sp.title)+'.html');}

function buildNav(s,cur,prod){
  var out='';
  var hHref=prod?'index.html':'#';
  var hClick=prod?'':' onclick="try{parent.switchPV(\'main\')}catch(e){} return false;"';out+='<a href="'+hHref+'"'+hClick+' class="'+(cur==='main'?'cur':'')+'" >HOME</a>';s.subPages.forEach(function(sp){
    var href=prod?getFn(sp):'#';
    var click=prod?'':' onclick="try{parent.switchPV(\''+sp.id+'\')}catch(e){} return false;"';out+='<a href="'+href+'"'+click+' class="'+(cur===sp.id?'cur':'')+'" >'+esc(sp.title).toUpperCase()+'</a>';
  });
  return out;
}

/* ===== ダウンロード ===== */
function dlSite(id){
  var s=getSite(id);if(!s)return;
  var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
  var files=[{name:'index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:sp._fn,html:buildSub(s,sp,true)});});
  var list=files.map(function(f){return f.name;}).join('\n');
  if(confirm('以下のファイルをダウンロードします：\n\n'+list+'\n\nサーバーにそのままアップロードしてください。よろしいですか？')){
    files.forEach(function(f,i){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},i*400);});
  }s.subPages.forEach(function(sp){delete sp._fn;});
}

function dlAll(){
  if(!sites.length){alert('サイトがありません');return;}
  var delay=0;sites.forEach(function(s){
    var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
    var files=[{name:s.name+'_index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:s.name+'_'+sp._fn,html:buildSub(s,sp,true)});});
    files.forEach(function(f){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},delay);delay+=400;});s.subPages.forEach(function(sp){delete sp._fn;});
  });
}

function loadFromFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!Array.isArray(data.sites))throw new Error('形式が違います');
      if(sites.length>0){
        if(!confirm('現在のデータに追加しますか？\nキャンセルで全置き換えします。')){sites=data.sites;}else{var ids=sites.map(function(s){return s.id;});data.sites.forEach(function(s){if(ids.indexOf(s.id)<0){sites.push(s);}else{s.id='s'+Date.now()+Math.random().toString(36).slice(2,5);sites.push(s);}});}

    }catch(err){alert('読み込み失敗: '+err.message);}
  };
  reader.readAsText(file,'utf-8');
  input.value='';
}

function setProgress(msg, pct){

async function runAnalyze(mode){
  // APIキー確認
  var apiKey = '';
  try{ apiKey = localStorage.getItem('analyze_api_key') || ''; }catch(e){}
  var inputKey = document.getElementById('analyzeApiKey').value.trim();
  if(inputKey) apiKey = inputKey;
  if(!apiKey){
    showAnalyzeError('APIキーが設定されていません。上の入力欄にAnthropic APIキーを入力してください。\n取得先: https://console.anthropic.com');
    return;
  }

  resetAnalyze();
  setProgress('サイトデータを取得しています...', 10);

  var htmlContent = '';
  var siteUrl = '';

  try{
    if(mode === 'url'){
      siteUrl = document.getElementById('analyzeUrl').value.trim();
      if(!siteUrl){ showAnalyzeError('URLを入力してください'); return; }
      if(!siteUrl.startsWith('http')) siteUrl = 'https://' + siteUrl;

      setProgress('サイトにアクセスしています...', 20);
      // CORSプロキシ経由でHTMLを取得
      var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(siteUrl);
      var res = await fetch(proxyUrl);
      if(!res.ok) throw new Error('サイトへのアクセスに失敗しました（HTTP ' + res.status + '）');
      var json = await res.json();
      htmlContent = json.contents || '';
      if(!htmlContent) throw new Error('サイトのHTMLを取得できませんでした。\nHTMLファイル方式に切り替えてお試しください。');

    } else {
      var file = document.getElementById('analyzeFile').files[0];
      if(!file){ showAnalyzeError('HTMLファイルを選択してください'); return; }
      htmlContent = await new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(e){ resolve(e.target.result); };
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    setProgress('Claude AIが解析しています...', 50);

    // HTMLを圧縮（長すぎる場合は先頭部分だけ使用）
    var cleanHtml = htmlContent
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<style[\s\S]*?<\/style>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 12000);

    var genreHint = document.getElementById('analyzeGenre').value;
    var genreText = genreHint ? '（業種ヒント：' + genreHint + '）' : '';

    // Claude APIに解析を依頼
    var prompt = 'あなたはホームページ制作の専門家です。\n以下のHTMLを解析して、このサイトの構成をJSON形式で返してください。' + genreText + '\n\n' +
      '以下のブロックタイプのみを使って構成を提案してください：\n' +
      'text（テキスト）, imgtext（画像+テキスト）, gallery（ギャラリー）, photo（写真1枚）,\n' +
      'menu（メニュー表）, staff（スタッフ）, shopinfo（店舗情報）, hours（営業時間）,\n' +
      'linkbtns（リンクボタン）, sns（SNS）, noticebar（通知バー）, faq（よくある質問）,\n' +
      'youtube（YouTube）, cta（CTAボタン）, news（お知らせ）, access（マップ）,\n' +
      'footerlinks（フッターリンク）, divider（区切り線）\n\n' +
      '以下のJSON形式で、mainBlocksのみを返してください（他のテキストは不要）：\n' +
      '{"siteName":"店名","genre":"salon","subTitle":"キャッチコピー","colors":{"bodyBg":"#0a0a0a","secBg":"#111111","textCol":"#e8e8e8","ac":"#d4c5a9"},"mainBlocks":[{"type":"ブロックタイプ","data":{...}},...]}\n\n' +
      '各ブロックのdataは実際のサイトの内容を使ってください。テキストは日本語で。\n' +
      '通知バー→ヒーロー（大見出し）→メインコンテンツ→店舗情報→フッターの順が推奨です。\n\n' +
      'HTMLデータ：\n' + cleanHtml;

    var apiRes = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4096,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if(!apiRes.ok){
      var errData = await apiRes.json().catch(function(){return {};});
      var errMsg = (errData.error && errData.error.message) || 'APIエラー（HTTP ' + apiRes.status + '）';
      if(apiRes.status === 401) errMsg = 'APIキーが無効です。正しいAPIキーを入力してください。';
      if(apiRes.status === 429) errMsg = 'APIの利用制限に達しました。しばらく待ってから再試行してください。';
      throw new Error(errMsg);
    }

    setProgress('ブロック構成を生成しています...', 80);

    var apiData = await apiRes.json();
    var responseText = apiData.content[0].text;

    // JSONを抽出
    var jsonMatch = responseText.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('レスポンスからJSON形式のデータを取得できませんでした。');

    var parsed = JSON.parse(jsonMatch[0]);
    if(!parsed.mainBlocks || !parsed.mainBlocks.length) throw new Error('ブロック構成データが空でした。');

    setProgress('完了！', 100);
    _analyzeResult = parsed;
    showAnalyzeResultPreview(parsed, siteUrl);

  } catch(err){
    showAnalyzeError(err.message || String(err));
  }
}

function applyAnalyzeResult(){
  if(!_analyzeResult) return;
  pushUndo();

  var d = _analyzeResult;
  var genre = d.genre || 'salon';
  var validGenres = ['eye','estec','estel','cafec','cafel','nail','bar','japanese','western','relax','salon','corporate'];
  if(validGenres.indexOf(genre) < 0) genre = 'salon';

  var s = makeNewSite(genre);
  if(d.siteName) s.name = d.siteName;
  if(d.subTitle)  s.tl  = d.subTitle;
  if(d.colors){
    if(d.colors.bodyBg) s.bodyBg = d.colors.bodyBg;
    if(d.colors.secBg)  s.secBg  = d.colors.secBg;
    if(d.colors.textCol)s.textCol= d.colors.textCol;
    if(d.colors.ac)     s.ac     = d.colors.ac;
  }

  // メインブロックを設定
  s.mainBlocks = (d.mainBlocks || []).map(function(b){
    return { type: b.type, data: b.data || {} };
  });

  sites.push(s);
  curSiteId = s.id;
  renderAll();
  goTab('edit');
  markDirty();
  showToast('「' + s.name + '」を' + s.mainBlocks.length + 'ブロックで生成しました！');
  resetAnalyze();

// === 保存状態フラグ ===
var _dirty = false;   // 未保存の変更があるか
var _undoStack = [];  // Undo履歴
var MAX_UNDO = 20;

// 変更通知（renderEdit等から呼ぶ）
function markDirty(){
  _dirty=true;
  updateSaveIndicator();
}

// 保存インジケーター更新
function updateSaveIndicator(){
  var el=document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent=_dirty?'● 未保存':'✓ 保存済み';
  el.style.color=_dirty?'#f59e0b':'#4ade80';
}

// Undo用スナップショットを記録
function pushUndo(){
  _undoStack.push(JSON.stringify(sites));
  if(_undoStack.length>MAX_UNDO) _undoStack.shift();
  markDirty();
}

// Undo実行
function undoEdit(){
  if(!_undoStack.length){showToast('これ以上戻せません');return;}
  sites=JSON.parse(_undoStack.pop());
  var sid=sites.find(function(s){return s.id===curSiteId;})?curSiteId:sites[0]&&sites[0].id;
  curSiteId=sid||null;
  renderAll();
  showToast('元に戻しました');
  markDirty();
}

// 手動保存（JSONダウンロード）
function saveData(){
  var data={version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hp_data_'+(new Date().toISOString().slice(0,10))+'.json';
  a.click();
  _dirty=false;
  updateSaveIndicator();
  showToast('保存しました');
}

// セッション内クイック保存（ブラウザ内）
function quickSave(){
  try{
    if(sites.length){
      localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));
      _dirty=false;
      updateSaveIndicator();
      showToast('保存しました（ブラウザ内）');
    }
  }catch(e){showToast('保存に失敗しました');}
}

// サイト複製
function duplicateSite(sid){
  var s=getSite(sid);
  if(!s) return;
  pushUndo();
  var newS=JSON.parse(JSON.stringify(s));
  newS.id='s'+Date.now()+'x'+Math.random().toString(36).slice(2,6);
  newS.name=s.name+'（コピー）';
  sites.push(newS);
  curSiteId=newS.id;
  renderAll();
  goTab('edit');
  showToast(s.name+'を複製しました');
}

function autoSave(){try{if(sites.length)localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));}catch(e){}}
function autoLoad(){
  // ブラウザ保存から復元
  try{
    var raw=localStorage.getItem('hp_autosave');
    if(raw){
      var data=JSON.parse(raw);
      if(data&&data.sites&&data.sites.length){
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        _dirty=false;
        updateSaveIndicator();
        showToast('前回のデータを自動復元しました（'+data.savedAt+'）');
      }
    }
  }catch(e){}
}

// JSONファイルから読み込む（上書き確認あり）
function loadData(){
  if(_dirty && sites.length){
    if(!confirm('現在の編集内容は破棄されます。読み込みますか？')) return;
  }
  document.getElementById('loadFile').click();
}

// ファイル読み込み処理（途中から再開）
function loadFromFile(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!data.sites.length){showToast('有効なデータがありません');return;}
      // 複数サイトある場合は選択ダイアログ
      if(data.sites.length===1){
        pushUndo();
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました：'+sites[0].name);
      } else {
        // 複数サイト：追加 or 上書き選択
        var choice=confirm(data.sites.length+'件のサイトが見つかりました。\n\n[OK] → 現在のデータに追加する\n[キャンセル] → 現在のデータを置き換える');
        pushUndo();
        if(choice){
          // 追加（IDが被らないようにリネーム）
          data.sites.forEach(function(s){
            var exists=sites.find(function(x){return x.id===s.id;});
            if(exists) s.id='s'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
            sites.push(s);
          });
        } else {
          sites=data.sites;
          curSiteId=sites[0].id;
        }
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました（'+data.sites.length+'件）');
      }
    }catch(err){showToast('ファイルの読み込みに失敗しました');}
    input.value='';
  };
  reader.readAsText(file);
}window.addEventListener('beforeunload',function(e){
  if(sites.length&&_dirty){
    e.preventDefault();
    e.returnValue='編集内容が保存されていません。終了しますか？';
    return '編集内容が保存されていません。終了しますか？';
  }
});window.addEventListener('DOMContentLoaded',function(){autoLoad();});

/* ===== HTML生成 ===== */
function getYtId(url){
  if(!url) return '';
  var m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m?m[1]:'';
}

function getVimeoId(url){
  if(!url) return '';
  var m=url.match(/vimeo\.com\/(\d+)/);
  return m?m[1]:'';
}

function slugify(t){return(t||'p').replace(/\s+/g,'-').replace(/[^\w぀-鿿-]/g,'').toLowerCase()||'page';}

function toEmbedUrl(url){
  if(!url) return '';
  var ytId=getYtId(url);
  if(ytId) return 'https://www.youtube-nocookie.com/embed/'+ytId+'?rel=0&modestbranding=1';
  var viId=getVimeoId(url);

/* ===== ダウンロード ===== */
function dlSite(id){
  var s=getSite(id);if(!s)return;
  var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
  var files=[{name:'index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:sp._fn,html:buildSub(s,sp,true)});});
  var list=files.map(function(f){return f.name;}).join('\n');
  if(confirm('以下のファイルをダウンロードします：\n\n'+list+'\n\nサーバーにそのままアップロードしてください。よろしいですか？')){
    files.forEach(function(f,i){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},i*400);});
  }s.subPages.forEach(function(sp){delete sp._fn;});
}

function dlAll(){
  if(!sites.length){alert('サイトがありません');return;}
  var delay=0;sites.forEach(function(s){
    var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
    var files=[{name:s.name+'_index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:s.name+'_'+sp._fn,html:buildSub(s,sp,true)});});
    files.forEach(function(f){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},delay);delay+=400;});s.subPages.forEach(function(sp){delete sp._fn;});
  });
}

/* ===== 保存・読み込み ===== */

  if(!sites.length){alert('保存するサイトがありません');return;}
  var data={version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites};

// === 保存状態フラグ ===
var _dirty = false;   // 未保存の変更があるか
var _undoStack = [];  // Undo履歴
var MAX_UNDO = 20;

// 変更通知（renderEdit等から呼ぶ）
function markDirty(){
  _dirty=true;
  updateSaveIndicator();
}

// 保存インジケーター更新
function updateSaveIndicator(){
  var el=document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent=_dirty?'● 未保存':'✓ 保存済み';
  el.style.color=_dirty?'#f59e0b':'#4ade80';
}

// Undo用スナップショットを記録
function pushUndo(){
  _undoStack.push(JSON.stringify(sites));
  if(_undoStack.length>MAX_UNDO) _undoStack.shift();
  markDirty();
}

// Undo実行
function undoEdit(){
  if(!_undoStack.length){showToast('これ以上戻せません');return;}
  sites=JSON.parse(_undoStack.pop());
  var sid=sites.find(function(s){return s.id===curSiteId;})?curSiteId:sites[0]&&sites[0].id;
  curSiteId=sid||null;
  renderAll();
  showToast('元に戻しました');
  markDirty();
}

// 手動保存（JSONダウンロード）
function saveData(){
  var data={version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hp_data_'+(new Date().toISOString().slice(0,10))+'.json';
  a.click();
  _dirty=false;
  updateSaveIndicator();
  showToast('保存しました');
}

// セッション内クイック保存（ブラウザ内）
function quickSave(){
  try{
    if(sites.length){
      localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));
      _dirty=false;
      updateSaveIndicator();
      showToast('保存しました（ブラウザ内）');
    }
  }catch(e){showToast('保存に失敗しました');}
}

// サイト複製
function duplicateSite(sid){
  var s=getSite(sid);
  if(!s) return;
  pushUndo();
  var newS=JSON.parse(JSON.stringify(s));
  newS.id='s'+Date.now()+'x'+Math.random().toString(36).slice(2,6);
  newS.name=s.name+'（コピー）';
  sites.push(newS);
  curSiteId=newS.id;
  renderAll();
  goTab('edit');
  showToast(s.name+'を複製しました');
}

function autoSave(){try{if(sites.length)localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));}catch(e){}}
function autoLoad(){
  // ブラウザ保存から復元
  try{
    var raw=localStorage.getItem('hp_autosave');
    if(raw){
      var data=JSON.parse(raw);
      if(data&&data.sites&&data.sites.length){
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        _dirty=false;
        updateSaveIndicator();
        showToast('前回のデータを自動復元しました（'+data.savedAt+'）');
      }
    }
  }catch(e){}
}

// JSONファイルから読み込む（上書き確認あり）
function loadData(){
  if(_dirty && sites.length){
    if(!confirm('現在の編集内容は破棄されます。読み込みますか？')) return;
  }
  document.getElementById('loadFile').click();
}

// ファイル読み込み処理（途中から再開）
function loadFromFile(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!data.sites.length){showToast('有効なデータがありません');return;}
      // 複数サイトある場合は選択ダイアログ
      if(data.sites.length===1){
        pushUndo();
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました：'+sites[0].name);
      } else {
        // 複数サイト：追加 or 上書き選択
        var choice=confirm(data.sites.length+'件のサイトが見つかりました。\n\n[OK] → 現在のデータに追加する\n[キャンセル] → 現在のデータを置き換える');
        pushUndo();
        if(choice){
          // 追加（IDが被らないようにリネーム）
          data.sites.forEach(function(s){
            var exists=sites.find(function(x){return x.id===s.id;});
            if(exists) s.id='s'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
            sites.push(s);
          });
        } else {
          sites=data.sites;
          curSiteId=sites[0].id;
        }
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました（'+data.sites.length+'件）');
      }
    }catch(err){showToast('ファイルの読み込みに失敗しました');}
    input.value='';
  };
  reader.readAsText(file);
}window.addEventListener('beforeunload',function(e){
  if(sites.length&&_dirty){
    e.preventDefault();
    e.returnValue='編集内容が保存されていません。終了しますか？';
    return '編集内容が保存されていません。終了しますか？';
  }
});window.addEventListener('DOMContentLoaded',function(){autoLoad();});

function openPdfManual(key){
  var url = _pdfData[key];
  if(!url){ showToast('PDFが見つかりません'); return; }
  var a = document.createElement('a');
  a.href = url;
  a.download = key === 'admin' ? '管理者マニュアル.pdf' : key + '.pdf';
  a.target = '_blank';
  // まず別タブで開く試み → 失敗したらDL
  var w = window.open(url, '_blank');
  if(!w) a.click();
}

// PDFを追加する（将来の拡張用）
function addPdfManual(key, name, b64){
  _pdfData[key] = 'data:application/pdf;base64,' + b64;
  var list = document.getElementById('manualList');
  if(!list) return;
  var item = document.createElement('div');
  item.className = 'sb-manual-item';
  item.innerHTML = '<span class="sb-manual-icon">📄</span><span class="sb-manual-name">' + name + '</span><span class="sb-manual-arrow">›</span>';
  item.onclick = function(){ openPdfManual(key); };
  list.appendChild(item);
}


function uploadImg(callback) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = function() {
    var file = inp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) { callback(e.target.result); };
    reader.readAsDataURL(file);
  };
  inp.click();
}

/* 画像入力UI（URL入力 + アップロードボタン）を返す */
function imgInputUI(currentSrc, onchangeJS, placeholderText) {
  var ph = placeholderText || 'https://...';
  return '<div style="display:flex;gap:5px;align-items:flex-start;margin-bottom:3px">'
    + '<input type="text" value="' + esc(currentSrc) + '" placeholder="' + ph + '" oninput="' + onchangeJS + '" style="flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:12px;color:#000">'
    + '<button onclick="' + onchangeJS.replace('this.value', '__UPL__') + '" data-cb="' + esc(onchangeJS) + '" class="upbtn" style="padding:5px 8px;border:1px solid #2563eb;border-radius:5px;background:#eff6ff;color:#2563eb;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="">📁 アップ</button>'
    + '</div>'
    + (currentSrc ? '<img src="' + esc(currentSrc) + '" style="width:100%;max-height:120px;object-fit:cover;border-radius:5px;border:1px solid #eee;margin-bottom:3px" onerror="this.style.display=\'none\'">' : '');
}

/* アップロードボタン専用（クリック時にFileReaderでbase64取得してコールバック） */
function makeUploadBtn(assignCode) {
  return 'uploadImg(function(b64){' + assignCode + ';renderEdit();})';
}

function uploadVideo(callback) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'video/*';
  inp.onchange = function() {
    var file = inp.files[0];
    if (!file) return;
    if (file.size > 50*1024*1024) {alert('動画ファイルが大きすぎます。50MB以下を推奨します。\n現在: '+Math.round(file.size/1024/1024)+'MB');
    }
    var reader = new FileReader();
    reader.onload = function(e) { callback(e.target.result); };
    reader.readAsDataURL(file);
  };
  inp.click();
}

/* ===== HTML生成 ===== */
function getYtId(url){
  if(!url) return '';
  var m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m?m[1]:'';
}

function getVimeoId(url){
  if(!url) return '';
  var m=url.match(/vimeo\.com\/(\d+)/);
  return m?m[1]:'';
}

function slugify(t){return(t||'p').replace(/\s+/g,'-').replace(/[^\w぀-鿿-]/g,'').toLowerCase()||'page';}

function toEmbedUrl(url){
  if(!url) return '';
  var ytId=getYtId(url);
  if(ytId) return 'https://www.youtube-nocookie.com/embed/'+ytId+'?rel=0&modestbranding=1';
  var viId=getVimeoId(url);
  if(viId) return 'https://player.vimeo.com/video/'+viId;
  if(url.indexOf('embed')>=0) return url;
  return '';
}
function getFn(sp){return sp._fn||(slugify(sp.title)+'.html');}

function buildNav(s,cur,prod){
  var out='';
  var hHref=prod?'index.html':'#';
  var hClick=prod?'':' onclick="try{parent.switchPV(\'main\')}catch(e){} return false;"';out+='<a href="'+hHref+'"'+hClick+' class="'+(cur==='main'?'cur':'')+'" >HOME</a>';s.subPages.forEach(function(sp){
    var href=prod?getFn(sp):'#';
    var click=prod?'':' onclick="try{parent.switchPV(\''+sp.id+'\')}catch(e){} return false;"';out+='<a href="'+href+'"'+click+' class="'+(cur===sp.id?'cur':'')+'" >'+esc(sp.title).toUpperCase()+'</a>';
  });
  return out;
}

/* ===== ダウンロード ===== */
function dlSite(id){
  var s=getSite(id);if(!s)return;
  var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
  var files=[{name:'index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:sp._fn,html:buildSub(s,sp,true)});});
  var list=files.map(function(f){return f.name;}).join('\n');
  if(confirm('以下のファイルをダウンロードします：\n\n'+list+'\n\nサーバーにそのままアップロードしてください。よろしいですか？')){
    files.forEach(function(f,i){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},i*400);});
  }s.subPages.forEach(function(sp){delete sp._fn;});
}

function dlAll(){
  if(!sites.length){alert('サイトがありません');return;}
  var delay=0;sites.forEach(function(s){
    var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
    var files=[{name:s.name+'_index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:s.name+'_'+sp._fn,html:buildSub(s,sp,true)});});
    files.forEach(function(f){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},delay);delay+=400;});s.subPages.forEach(function(sp){delete sp._fn;});
  });
}

  var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});

function loadFromFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!Array.isArray(data.sites))throw new Error('形式が違います');
      if(sites.length>0){
        if(!confirm('現在のデータに追加しますか？\nキャンセルで全置き換えします。')){sites=data.sites;}else{var ids=sites.map(function(s){return s.id;});data.sites.forEach(function(s){if(ids.indexOf(s.id)<0){sites.push(s);}else{s.id='s'+Date.now()+Math.random().toString(36).slice(2,5);sites.push(s);}});}
      }else{sites=data.sites;}curSiteId=sites.length?sites[0].id:null;curEditPage='main';curPvPage='main';
      renderAll();goTab('manage');showToast(data.sites.length+'件を読み込みました');
    }catch(err){alert('読み込み失敗: '+err.message);}
  };
  reader.readAsText(file,'utf-8');
  input.value='';
}

async function runAnalyze(mode){
  // APIキー確認
  var apiKey = '';
  try{ apiKey = localStorage.getItem('analyze_api_key') || ''; }catch(e){}
  var inputKey = document.getElementById('analyzeApiKey').value.trim();
  if(inputKey) apiKey = inputKey;
  if(!apiKey){
    showAnalyzeError('APIキーが設定されていません。上の入力欄にAnthropic APIキーを入力してください。\n取得先: https://console.anthropic.com');
    return;
  }

  resetAnalyze();
  setProgress('サイトデータを取得しています...', 10);

  var htmlContent = '';
  var siteUrl = '';

  try{
    if(mode === 'url'){
      siteUrl = document.getElementById('analyzeUrl').value.trim();
      if(!siteUrl){ showAnalyzeError('URLを入力してください'); return; }
      if(!siteUrl.startsWith('http')) siteUrl = 'https://' + siteUrl;

      setProgress('サイトにアクセスしています...', 20);
      // CORSプロキシ経由でHTMLを取得
      var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(siteUrl);
      var res = await fetch(proxyUrl);
      if(!res.ok) throw new Error('サイトへのアクセスに失敗しました（HTTP ' + res.status + '）');
      var json = await res.json();
      htmlContent = json.contents || '';
      if(!htmlContent) throw new Error('サイトのHTMLを取得できませんでした。\nHTMLファイル方式に切り替えてお試しください。');

    } else {
      var file = document.getElementById('analyzeFile').files[0];
      if(!file){ showAnalyzeError('HTMLファイルを選択してください'); return; }
      htmlContent = await new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(e){ resolve(e.target.result); };
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    setProgress('Claude AIが解析しています...', 50);

    // HTMLを圧縮（長すぎる場合は先頭部分だけ使用）
    var cleanHtml = htmlContent
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<style[\s\S]*?<\/style>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 12000);

    var genreHint = document.getElementById('analyzeGenre').value;
    var genreText = genreHint ? '（業種ヒント：' + genreHint + '）' : '';

    // Claude APIに解析を依頼
    var prompt = 'あなたはホームページ制作の専門家です。\n以下のHTMLを解析して、このサイトの構成をJSON形式で返してください。' + genreText + '\n\n' +
      '以下のブロックタイプのみを使って構成を提案してください：\n' +
      'text（テキスト）, imgtext（画像+テキスト）, gallery（ギャラリー）, photo（写真1枚）,\n' +
      'menu（メニュー表）, staff（スタッフ）, shopinfo（店舗情報）, hours（営業時間）,\n' +
      'linkbtns（リンクボタン）, sns（SNS）, noticebar（通知バー）, faq（よくある質問）,\n' +
      'youtube（YouTube）, cta（CTAボタン）, news（お知らせ）, access（マップ）,\n' +
      'footerlinks（フッターリンク）, divider（区切り線）\n\n' +
      '以下のJSON形式で、mainBlocksのみを返してください（他のテキストは不要）：\n' +
      '{"siteName":"店名","genre":"salon","subTitle":"キャッチコピー","colors":{"bodyBg":"#0a0a0a","secBg":"#111111","textCol":"#e8e8e8","ac":"#d4c5a9"},"mainBlocks":[{"type":"ブロックタイプ","data":{...}},...]}\n\n' +
      '各ブロックのdataは実際のサイトの内容を使ってください。テキストは日本語で。\n' +
      '通知バー→ヒーロー（大見出し）→メインコンテンツ→店舗情報→フッターの順が推奨です。\n\n' +
      'HTMLデータ：\n' + cleanHtml;

    var apiRes = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4096,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if(!apiRes.ok){
      var errData = await apiRes.json().catch(function(){return {};});
      var errMsg = (errData.error && errData.error.message) || 'APIエラー（HTTP ' + apiRes.status + '）';
      if(apiRes.status === 401) errMsg = 'APIキーが無効です。正しいAPIキーを入力してください。';
      if(apiRes.status === 429) errMsg = 'APIの利用制限に達しました。しばらく待ってから再試行してください。';
      throw new Error(errMsg);
    }

    setProgress('ブロック構成を生成しています...', 80);

    var apiData = await apiRes.json();
    var responseText = apiData.content[0].text;

    // JSONを抽出
    var jsonMatch = responseText.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('レスポンスからJSON形式のデータを取得できませんでした。');

    var parsed = JSON.parse(jsonMatch[0]);
    if(!parsed.mainBlocks || !parsed.mainBlocks.length) throw new Error('ブロック構成データが空でした。');

    setProgress('完了！', 100);
    _analyzeResult = parsed;
    showAnalyzeResultPreview(parsed, siteUrl);

  } catch(err){
    showAnalyzeError(err.message || String(err));
  }
}

function applyAnalyzeResult(){
  if(!_analyzeResult) return;
  pushUndo();

  var d = _analyzeResult;
  var genre = d.genre || 'salon';
  var validGenres = ['eye','estec','estel','cafec','cafel','nail','bar','japanese','western','relax','salon','corporate'];
  if(validGenres.indexOf(genre) < 0) genre = 'salon';

  var s = makeNewSite(genre);
  if(d.siteName) s.name = d.siteName;
  if(d.subTitle)  s.tl  = d.subTitle;
  if(d.colors){
    if(d.colors.bodyBg) s.bodyBg = d.colors.bodyBg;
    if(d.colors.secBg)  s.secBg  = d.colors.secBg;
    if(d.colors.textCol)s.textCol= d.colors.textCol;
    if(d.colors.ac)     s.ac     = d.colors.ac;
  }

  // メインブロックを設定
  s.mainBlocks = (d.mainBlocks || []).map(function(b){
    return { type: b.type, data: b.data || {} };
  });

  sites.push(s);
  curSiteId = s.id;
  renderAll();
  goTab('edit');
  markDirty();
  showToast('「' + s.name + '」を' + s.mainBlocks.length + 'ブロックで生成しました！');
  resetAnalyze();
}
function showToast(msg){
  var t=document.getElementById('toast');

}

// 保存インジケーター更新
function updateSaveIndicator(){
  var el=document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent=_dirty?'● 未保存':'✓ 保存済み';
  el.style.color=_dirty?'#f59e0b':'#4ade80';
}

// Undo用スナップショットを記録
function pushUndo(){
  _undoStack.push(JSON.stringify(sites));
  if(_undoStack.length>MAX_UNDO) _undoStack.shift();
  markDirty();
}

// Undo実行
function undoEdit(){
  if(!_undoStack.length){showToast('これ以上戻せません');return;}
  sites=JSON.parse(_undoStack.pop());
  var sid=sites.find(function(s){return s.id===curSiteId;})?curSiteId:sites[0]&&sites[0].id;
  curSiteId=sid||null;
  renderAll();
  showToast('元に戻しました');
  markDirty();
}

// 手動保存（JSONダウンロード）
function saveData(){
  var data={version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hp_data_'+(new Date().toISOString().slice(0,10))+'.json';
  a.click();
  _dirty=false;
  updateSaveIndicator();
  showToast('保存しました');
}

// セッション内クイック保存（ブラウザ内）
function quickSave(){
  try{
    if(sites.length){
      localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));
      _dirty=false;
      updateSaveIndicator();
      showToast('保存しました（ブラウザ内）');
    }
  }catch(e){showToast('保存に失敗しました');}
}

// サイト複製
function duplicateSite(sid){
  var s=getSite(sid);
  if(!s) return;
  pushUndo();
  var newS=JSON.parse(JSON.stringify(s));
  newS.id='s'+Date.now()+'x'+Math.random().toString(36).slice(2,6);
  newS.name=s.name+'（コピー）';
  sites.push(newS);
  curSiteId=newS.id;
  renderAll();
  goTab('edit');
  showToast(s.name+'を複製しました');
}

function autoSave(){try{if(sites.length)localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));}catch(e){}}
function autoLoad(){
  // ブラウザ保存から復元
  try{
    var raw=localStorage.getItem('hp_autosave');
    if(raw){
      var data=JSON.parse(raw);
      if(data&&data.sites&&data.sites.length){
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        _dirty=false;
        updateSaveIndicator();
        showToast('前回のデータを自動復元しました（'+data.savedAt+'）');
      }
    }
  }catch(e){}
}

// JSONファイルから読み込む（上書き確認あり）
function loadData(){
  if(_dirty && sites.length){
    if(!confirm('現在の編集内容は破棄されます。読み込みますか？')) return;
  }
  document.getElementById('loadFile').click();
}

// ファイル読み込み処理（途中から再開）
function loadFromFile(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!data.sites.length){showToast('有効なデータがありません');return;}
      // 複数サイトある場合は選択ダイアログ
      if(data.sites.length===1){
        pushUndo();
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました：'+sites[0].name);
      } else {
        // 複数サイト：追加 or 上書き選択
        var choice=confirm(data.sites.length+'件のサイトが見つかりました。\n\n[OK] → 現在のデータに追加する\n[キャンセル] → 現在のデータを置き換える');
        pushUndo();
        if(choice){
          // 追加（IDが被らないようにリネーム）
          data.sites.forEach(function(s){
            var exists=sites.find(function(x){return x.id===s.id;});
            if(exists) s.id='s'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
            sites.push(s);
          });
        } else {
          sites=data.sites;
          curSiteId=sites[0].id;
        }
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました（'+data.sites.length+'件）');
      }
    }catch(err){showToast('ファイルの読み込みに失敗しました');}
    input.value='';
  };
  reader.readAsText(file);
}window.addEventListener('beforeunload',function(e){
  if(sites.length&&_dirty){
    e.preventDefault();
    e.returnValue='編集内容が保存されていません。終了しますか？';
    return '編集内容が保存されていません。終了しますか？';
  }
});window.addEventListener('DOMContentLoaded',function(){autoLoad();});

/* ===== HTML生成 ===== */
function getYtId(url){
  if(!url) return '';
  var m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m?m[1]:'';
}

function getVimeoId(url){
  if(!url) return '';
  var m=url.match(/vimeo\.com\/(\d+)/);
  return m?m[1]:'';
}

function slugify(t){return(t||'p').replace(/\s+/g,'-').replace(/[^\w぀-鿿-]/g,'').toLowerCase()||'page';}

function toEmbedUrl(url){
  if(!url) return '';
  var ytId=getYtId(url);
  if(ytId) return 'https://www.youtube-nocookie.com/embed/'+ytId+'?rel=0&modestbranding=1';
  var viId=getVimeoId(url);
  if(viId) return 'https://player.vimeo.com/video/'+viId;
  if(url.indexOf('embed')>=0) return url;
  return '';
}
function getFn(sp){return sp._fn||(slugify(sp.title)+'.html');}

function buildNav(s,cur,prod){
  var out='';
  var hHref=prod?'index.html':'#';
  var hClick=prod?'':' onclick="try{parent.switchPV(\'main\')}catch(e){} return false;"';out+='<a href="'+hHref+'"'+hClick+' class="'+(cur==='main'?'cur':'')+'" >HOME</a>';s.subPages.forEach(function(sp){
    var href=prod?getFn(sp):'#';
    var click=prod?'':' onclick="try{parent.switchPV(\''+sp.id+'\')}catch(e){} return false;"';out+='<a href="'+href+'"'+click+' class="'+(cur===sp.id?'cur':'')+'" >'+esc(sp.title).toUpperCase()+'</a>';
  });
  return out;
}

/* ===== ダウンロード ===== */
function dlSite(id){
  var s=getSite(id);if(!s)return;
  var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
  var files=[{name:'index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:sp._fn,html:buildSub(s,sp,true)});});
  var list=files.map(function(f){return f.name;}).join('\n');
  if(confirm('以下のファイルをダウンロードします：\n\n'+list+'\n\nサーバーにそのままアップロードしてください。よろしいですか？')){
    files.forEach(function(f,i){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},i*400);});
  }s.subPages.forEach(function(sp){delete sp._fn;});
}

function dlAll(){
  if(!sites.length){alert('サイトがありません');return;}
  var delay=0;sites.forEach(function(s){
    var used={};s.subPages.forEach(function(sp){var b=slugify(sp.title);used[b]=(used[b]||0)+1;sp._fn=used[b]>1?b+'-'+used[b]+'.html':b+'.html';});
    var files=[{name:s.name+'_index.html',html:buildMain(s,true)}];s.subPages.forEach(function(sp){files.push({name:s.name+'_'+sp._fn,html:buildSub(s,sp,true)});});
    files.forEach(function(f){setTimeout(function(){var b=new Blob([f.html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},delay);delay+=400;});s.subPages.forEach(function(sp){delete sp._fn;});
  });
}

function saveData(){

  var a=document.createElement('a');a.href=URL.createObjectURL(b);

function loadData(){document.getElementById('loadFile').click();}
function loadFromFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!Array.isArray(data.sites))throw new Error('形式が違います');
      if(sites.length>0){
        if(!confirm('現在のデータに追加しますか？\nキャンセルで全置き換えします。')){sites=data.sites;}else{var ids=sites.map(function(s){return s.id;});data.sites.forEach(function(s){if(ids.indexOf(s.id)<0){sites.push(s);}else{s.id='s'+Date.now()+Math.random().toString(36).slice(2,5);sites.push(s);}});}
      }else{sites=data.sites;}curSiteId=sites.length?sites[0].id:null;curEditPage='main';curPvPage='main';
      renderAll();goTab('manage');showToast(data.sites.length+'件を読み込みました');
    }catch(err){alert('読み込み失敗: '+err.message);}
  };
  reader.readAsText(file,'utf-8');

  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 20px;border-radius:8px;font-size:12px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw;text-align:center;transition:opacity .3s';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},3000);
}
// === 保存状態フラグ ===
var _dirty = false;   // 未保存の変更があるか
var _undoStack = [];  // Undo履歴
var MAX_UNDO = 20;

// 変更通知（renderEdit等から呼ぶ）
function markDirty(){
  _dirty=true;
  updateSaveIndicator();
}

// 保存インジケーター更新
function updateSaveIndicator(){
  var el=document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent=_dirty?'● 未保存':'✓ 保存済み';
  el.style.color=_dirty?'#f59e0b':'#4ade80';
}

// Undo用スナップショットを記録
function pushUndo(){
  _undoStack.push(JSON.stringify(sites));
  if(_undoStack.length>MAX_UNDO) _undoStack.shift();
  markDirty();
}

// Undo実行
function undoEdit(){
  if(!_undoStack.length){showToast('これ以上戻せません');return;}
  sites=JSON.parse(_undoStack.pop());
  var sid=sites.find(function(s){return s.id===curSiteId;})?curSiteId:sites[0]&&sites[0].id;
  curSiteId=sid||null;
  renderAll();
  showToast('元に戻しました');
  markDirty();
}

// 手動保存（JSONダウンロード）
function saveData(){
  var data={version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hp_data_'+(new Date().toISOString().slice(0,10))+'.json';
  a.click();
  _dirty=false;
  updateSaveIndicator();
  showToast('保存しました');
}

// セッション内クイック保存（ブラウザ内）
function quickSave(){
  try{
    if(sites.length){
      localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));
      _dirty=false;
      updateSaveIndicator();
      showToast('保存しました（ブラウザ内）');
    }
  }catch(e){showToast('保存に失敗しました');}
}

// サイト複製
function duplicateSite(sid){
  var s=getSite(sid);
  if(!s) return;
  pushUndo();
  var newS=JSON.parse(JSON.stringify(s));
  newS.id='s'+Date.now()+'x'+Math.random().toString(36).slice(2,6);
  newS.name=s.name+'（コピー）';
  sites.push(newS);
  curSiteId=newS.id;
  renderAll();
  goTab('edit');
  showToast(s.name+'を複製しました');
}

function autoSave(){try{if(sites.length)localStorage.setItem('hp_autosave',JSON.stringify({version:'1.0',savedAt:new Date().toLocaleString('ja-JP'),sites:sites}));}catch(e){}}
function autoLoad(){
  // ブラウザ保存から復元
  try{
    var raw=localStorage.getItem('hp_autosave');
    if(raw){
      var data=JSON.parse(raw);
      if(data&&data.sites&&data.sites.length){
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        _dirty=false;
        updateSaveIndicator();
        showToast('前回のデータを自動復元しました（'+data.savedAt+'）');
      }
    }
  }catch(e){}
}

  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.sites||!data.sites.length){showToast('有効なデータがありません');return;}
      // 複数サイトある場合は選択ダイアログ
      if(data.sites.length===1){
        pushUndo();
        sites=data.sites;
        curSiteId=sites[0].id;
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました：'+sites[0].name);
      } else {
        // 複数サイト：追加 or 上書き選択
        var choice=confirm(data.sites.length+'件のサイトが見つかりました。\n\n[OK] → 現在のデータに追加する\n[キャンセル] → 現在のデータを置き換える');
        pushUndo();
        if(choice){
          // 追加（IDが被らないようにリネーム）
          data.sites.forEach(function(s){
            var exists=sites.find(function(x){return x.id===s.id;});
            if(exists) s.id='s'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
            sites.push(s);
          });
        } else {
          sites=data.sites;
          curSiteId=sites[0].id;
        }
        renderAll();
        goTab('manage');
        _dirty=false;
        updateSaveIndicator();
        showToast('読み込みました（'+data.sites.length+'件）');
      }
    }catch(err){showToast('ファイルの読み込みに失敗しました');}
    input.value='';
  };
  reader.readAsText(file);
}window.addEventListener('beforeunload',function(e){
  if(sites.length&&_dirty){
    e.preventDefault();
    e.returnValue='編集内容が保存されていません。終了しますか？';
    return '編集内容が保存されていません。終了しますか？';
  }
});window.addEventListener('DOMContentLoaded',function(){autoLoad();});


</script>
</body>
</html>
