<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEBLINO | ホームページ制作サービス</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--s1:#0f0f18;--s2:#161620;--s3:#1e1e2c;
  --bd:#252535;--bd2:#32324a;
  --ac:#7c3aed;--ac2:#a855f7;--pink:#e1306c;
  --gold:#f59e0b;--green:#16a34a;
  --text:#f0f0f8;--muted:#7a7a90;--muted2:#50505f;
  --grad:linear-gradient(135deg,#7c3aed,#e1306c);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column}

/* ===== HEADER ===== */
.header{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 24px;display:flex;align-items:center;gap:16px;height:52px;flex-shrink:0}
.logo{font-family:'Playfair Display',serif;font-size:18px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.02em}
.logo-tag{font-size:10px;color:var(--muted);letter-spacing:.08em}
.hsp{flex:1}
.hbadge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(124,58,237,.15);color:var(--ac2)}
.hbtn{padding:6px 16px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;border:none;display:flex;align-items:center;gap:5px}
.hbtn-ghost{background:var(--s2);border:1px solid var(--bd);color:var(--muted)}
.hbtn-ghost:hover{border-color:var(--ac);color:var(--ac)}
.hbtn-p{background:var(--grad);color:#fff}
.hbtn-p:hover{opacity:.85}
.hbtn:disabled{opacity:.35;cursor:default}

/* ===== MAIN ===== */
.app{display:grid;grid-template-columns:320px 1fr;flex:1;overflow:hidden;min-height:0}

/* ===== LEFT PANEL ===== */
.left{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.left-scroll{flex:1;overflow-y:auto;padding:16px}

/* 業種グリッド */
.sec-label{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;margin-top:14px}
.sec-label:first-child{margin-top:0}
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.gbtn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 8px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden}
.gbtn::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity .2s}
.gbtn:hover{border-color:var(--ac);transform:translateY(-1px)}
.gbtn:hover::before{opacity:.06}
.gbtn.on{border-color:var(--ac);background:rgba(124,58,237,.1)}
.gbtn.on::before{opacity:.08}
.gbtn-inner{position:relative;z-index:1}
.gbtn-img{width:100%;height:48px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block}
.gbtn-icon{font-size:22px;display:block;margin-bottom:4px;line-height:1}
.gbtn-name{font-size:11px;font-weight:700;color:var(--text);line-height:1.3}
.gbtn-sub{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.3}
.gbtn-check{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--ac);display:none;align-items:center;justify-content:center;font-size:9px;color:#fff}
.gbtn.on .gbtn-check{display:flex}

/* 入力フォーム */
.form-area{padding:0 16px 16px;flex-shrink:0;border-top:1px solid var(--bd)}
.fi-label{font-size:10px;color:var(--muted);margin-bottom:4px;margin-top:12px;display:block}
.fi{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--text);padding:9px 11px;font-size:12px;outline:none;font-family:inherit;transition:border-color .15s}
.fi:focus{border-color:var(--ac)}
.fi::placeholder{color:var(--muted2)}
.gen-btn{width:100%;padding:12px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.gen-btn:hover{opacity:.88}
.gen-btn:disabled{opacity:.4;cursor:default}
.err{font-size:11px;color:#ef4444;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:7px;padding:7px 10px;margin-top:8px;display:none}

/* ===== RIGHT: PREVIEW ===== */
.preview-col{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* 上部バー */
.pv-bar{background:var(--s1);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.pv-dots{display:flex;gap:5px}
.pv-dot{width:9px;height:9px;border-radius:50%}
.pv-dot-r{background:#ef4444}.pv-dot-y{background:#f59e0b}.pv-dot-g{background:#22c55e}
.pv-url{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:4px 9px;font-size:10px;color:var(--muted);font-family:monospace}
.pv-btns{display:flex;gap:5px}
.pvbtn{padding:4px 10px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--s2);color:var(--muted);transition:all .15s}
.pvbtn:hover,.pvbtn.on{border-color:var(--ac);color:var(--ac)}
.pvbtn.on{background:rgba(124,58,237,.1)}

/* プレビューエリア */
.pv-wrap{flex:1;overflow:hidden;position:relative;background:var(--s2);display:flex;align-items:flex-start;justify-content:center}
.pv-frame-wrap{width:100%;height:100%;background:#fff;transition:all .3s}
#previewFrame{width:100%;height:100%;border:none}
.pv-wrap.sp-mode{padding:16px;align-items:flex-start}
.pv-wrap.sp-mode .pv-frame-wrap{width:390px;height:calc(100% - 32px);border-radius:28px;overflow:hidden;border:6px solid var(--bd2);box-shadow:0 16px 48px rgba(0,0,0,.6)}

/* Empty state */
.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--s2)}
.es-icon{font-size:52px;margin-bottom:16px;opacity:.2}
.es-title{font-size:20px;font-weight:700;color:var(--text);opacity:.4;margin-bottom:8px}
.es-sub{font-size:13px;color:var(--muted);line-height:1.8;opacity:.6}
.es-arrow{font-size:28px;opacity:.2;margin-top:16px;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateX(-8px)}50%{transform:translateX(0)}}

/* ジャンル選択時のティーザー */
.genre-teaser{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:var(--s2)}
.gt-img{width:100%;max-width:520px;height:220px;object-fit:cover;border-radius:12px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.gt-badge{font-size:10px;font-weight:700;letter-spacing:.1em;padding:4px 12px;border-radius:20px;background:rgba(124,58,237,.2);color:var(--ac2);margin-bottom:10px;display:inline-block}
.gt-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.gt-desc{font-size:13px;color:var(--muted);line-height:1.7;max-width:380px}
.gt-hint{font-size:11px;color:var(--ac2);margin-top:16px;font-weight:700}

/* アクションバー */
.action-bar{background:var(--s1);border-top:1px solid var(--bd);padding:10px 16px;display:none;align-items:center;gap:8px;flex-shrink:0}
.action-bar.show{display:flex}
.ab-info{flex:1;font-size:11px;color:var(--muted)}
.ab-name{font-size:13px;font-weight:700;color:var(--text)}
.ab-badge{font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(22,163,74,.15);color:#22c55e;font-weight:700;margin-left:6px}
.dl-btn{padding:9px 18px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:6px}
.dl-sample{background:var(--s2);border:1px solid var(--bd);color:var(--muted)}
.dl-sample:hover{border-color:var(--ac);color:var(--ac)}
.dl-edit{background:var(--grad);color:#fff}
.dl-edit:hover{opacity:.85}
.dl-note{font-size:9px;color:var(--muted2);display:block;margin-top:2px;text-align:center}

/* toast */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:8px 16px;border-radius:8px;font-size:12px;display:none;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
.toast.show{display:block}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="logo">WEBLINO</div>
  </div>
  <div class="logo-tag">ホームページ制作サービス | 営業用デモ</div>
  <div class="hsp"></div>
  <span class="hbadge">14業種対応</span>
  <button class="hbtn hbtn-ghost" onclick="toggleDevice()" id="deviceBtn">📱 スマホ</button>
</div>

<div class="app">

<!-- LEFT -->
<div class="left">
  <div class="left-scroll">

    <div class="sec-label">業種を選ぶ（16業種）</div>

    <div class="genre-grid" id="genreGrid">
      <!-- JS で生成 -->
    </div>

  </div>

  <div class="form-area">
    <label class="fi-label">店舗名・屋号</label>
    <input class="fi" id="sname" placeholder="例：Hair Salon Bloom" maxlength="40">
    <label class="fi-label">Googleマップ（任意）</label>
    <input class="fi" id="mapEmbed" placeholder="共有URL または 埋め込みコードを貼り付け">
    <div class="err" id="errMsg">業種と店舗名を入力してください</div>
    <button class="gen-btn" id="genBtn" onclick="generate()" disabled>
      <span>✨</span> ホームページをプレビュー
    </button>
  </div>
</div>

<!-- RIGHT -->
<div class="preview-col">
  <div class="pv-bar">
    <div class="pv-dots"><div class="pv-dot pv-dot-r"></div><div class="pv-dot pv-dot-y"></div><div class="pv-dot pv-dot-g"></div></div>
    <div class="pv-url" id="pvUrl">— 業種を選択してください —</div>
    <div class="pv-btns">
      <button class="pvbtn on" onclick="setZoom(100,this)">100%</button>
      <button class="pvbtn" onclick="setZoom(75,this)">75%</button>
      <button class="pvbtn" onclick="setZoom(50,this)">50%</button>
    </div>
  </div>

  <div class="pv-wrap" id="pvWrap">
    <!-- Empty -->
    <div class="empty-state" id="emptyState">
      <div class="es-icon">🏠</div>
      <div class="es-title">業種を選んでください</div>
      <div class="es-sub">左のパネルから業種をクリックすると<br>ホームページのプレビューが表示されます</div>
      <div class="es-arrow">←</div>
    </div>

    <!-- ジャンルティーザー -->
    <div class="genre-teaser" id="genreTeaser">
      <img class="gt-img" id="teaserImg" src="" alt="">
      <div class="gt-badge" id="teaserBadge">SALON</div>
      <div class="gt-title" id="teaserTitle">業種名</div>
      <div class="gt-desc" id="teaserDesc">説明</div>
      <div class="gt-hint">↓ 店舗名を入力してプレビューを生成</div>
    </div>

    <!-- プレビューフレーム -->
    <div class="pv-frame-wrap" id="pvFrameWrap" style="display:none">
      <iframe id="previewFrame" sandbox="allow-same-origin allow-scripts"></iframe>
    </div>
  </div>

  <!-- アクションバー -->
  <div class="action-bar" id="actionBar">
    <div class="ab-info">
      <div class="ab-name" id="abName">—</div>
      <span class="ab-badge">プレビュー生成済み</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <button class="dl-btn dl-sample" onclick="dlSample()">⬇ サンプルDL<br><span class="dl-note">クライアント用（編集不可）</span></button>
    </div>
    <!-- 編集用DL: KO-SK専用（クライアントに非表示） -->
    <div style="display:none">
      <button class="dl-btn dl-edit" onclick="dlEdit()">✏ 編集用DL</button>
    </div>
  </div>
</div>

</div>

<div class="toast" id="toast"></div>

var genreKeys = Object.keys(T);
var selectedGenre = null;
var generatedHTML = '';
var isSP = false;

// ===== INIT =====
(function(){
  var grid = document.getElementById('genreGrid');
  genreKeys.forEach(function(key){
    var t = T[key];
    var btn = document.createElement('div');
    btn.className = 'gbtn';
    btn.onclick = function(){ selectGenre(key); };
    btn.innerHTML =
      '<div class="gbtn-inner">'+
      '<img class="gbtn-img" src="'+t.hero+'" alt="" loading="lazy">'+
      '<div class="gbtn-name">'+t.name+'</div>'+
      '<div class="gbtn-sub">'+t.sub+'</div>'+
      '<div class="gbtn-check">✓</div>'+
      '</div>';
    grid.appendChild(btn);
  });
  document.getElementById('sname').addEventListener('input', onInput);
})();

function onInput(){
  var hasGenre = selectedGenre !== null;
  var hasName = document.getElementById('sname').value.trim().length > 0;
  document.getElementById('genBtn').disabled = !(hasGenre && hasName);
}

function selectGenre(key){
  selectedGenre = key;
  var t = T[key];
  // ボタンのon状態
  document.querySelectorAll('.gbtn').forEach(function(b){ b.classList.remove('on'); });
  event.currentTarget.classList.add('on');
  // ティーザー表示
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('pvFrameWrap').style.display = 'none';
  document.getElementById('actionBar').classList.remove('show');
  var teaser = document.getElementById('genreTeaser');
  teaser.style.display = 'flex';
  document.getElementById('teaserImg').src = t.hero;
  document.getElementById('teaserImg').style.display = '';
  document.getElementById('teaserBadge').textContent = t.tag;
  document.getElementById('teaserTitle').textContent = t.catch;
  document.getElementById('teaserDesc').textContent = t.desc;
  document.getElementById('pvUrl').textContent = 'preview://'+t.sub.toLowerCase().replace(/\s/g,'-')+'.jp';
  onInput();
}

// ===== GENERATE =====
function generate(){
  var name = document.getElementById('sname').value.trim();
  if(!selectedGenre || !name){
    document.getElementById('errMsg').style.display='block'; return;
  }
  document.getElementById('errMsg').style.display='none';
  var t = T[selectedGenre];
  var mapRaw = document.getElementById('mapEmbed').value.trim();
  var mapSrc = extractMapSrc(mapRaw);
  generatedHTML = buildHP(name, t, mapSrc);
  showPreview(generatedHTML, name);
}

function extractMapSrc(v){
  var m = v.match(/src="([^"]+)"/);
  if(m) return m[1];
  if(v.startsWith('http')) return v;
  return '';
}

function showPreview(html, name){
  document.getElementById('genreTeaser').style.display='none';
  document.getElementById('emptyState').style.display='none';
  document.getElementById('pvFrameWrap').style.display='';
  document.getElementById('previewFrame').srcdoc = html;
  document.getElementById('pvUrl').textContent = name.toLowerCase().replace(/\s/g,'-')+'.com';
  document.getElementById('actionBar').classList.add('show');
  document.getElementById('abName').textContent = name + ' - ' + T[selectedGenre].name;
}

    'setTimeout(function(){var b=document.getElementById("hbg");b&&b.classList.add("ld");},100);'+
    'var obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("visible");obs.unobserve(e.target);}});},{threshold:0.15});'+
    'document.querySelectorAll(".reveal,.gi,.mr").forEach(function(el){obs.observe(el);});'+
    '<\/script></body></html>';
}

// ===== DOWNLOAD =====
function dlSample(){
  if(!generatedHTML){ toast('先にプレビューを生成してください'); return; }
  // サンプル版：「Powered by WEBLINO」バナーを追加
  var sampleHTML = generatedHTML.replace('</body>',
    '<div style="position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.95);color:#fff;text-align:center;padding:10px;font-size:11px;font-family:sans-serif;z-index:9999;border-top:1px solid rgba(255,255,255,.1)">'+
    'このサイトは <strong style="color:#a855f7">WEBLINO</strong> で制作されたサンプルです。正式版のご依頼はお気軽にご相談ください。</div>'+
    '</body>');
  dl(sampleHTML, 'sample_' + T[selectedGenre].name + '.html');
  toast('サンプルHTMLをダウンロードしました');
}

function dlEdit(){
  if(!generatedHTML){ toast('先にプレビューを生成してください'); return; }
  // 編集用：そのまま（hp_studioで開ける）
  // localStorage に保存してhp_studioで開ける形式
  try{ localStorage.setItem('hp_ai_generated', generatedHTML); }catch(e){}
  dl(generatedHTML, 'edit_' + document.getElementById('sname').value.trim() + '.html');
  toast('編集用HTMLをダウンロード。HP Studioにドロップして編集できます！');
}

function dl(html, filename){
  var a = document.createElement('a');
  a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
  a.download = filename;
  a.click();
}

// ===== UI =====
function toggleDevice(){
  isSP = !isSP;
  document.getElementById('pvWrap').className = 'pv-wrap' + (isSP ? ' sp-mode' : '');
  document.getElementById('deviceBtn').textContent = isSP ? '🖥 PC' : '📱 スマホ';
}

function setZoom(p, el){
  var w = document.getElementById('pv-frame-wrap') || document.getElementById('pvFrameWrap');
  if(p===100){ w.style.transform='';w.style.width='100%';w.style.height='100%'; }
  else{ w.style.transformOrigin='top left';w.style.transform='scale('+p/100+')';w.style.width=(100/(p/100))+'%';w.style.height=(100/(p/100))+'%'; }
  document.querySelectorAll('.pvbtn').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
}

function toast(msg){ var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2800); }
</script>
